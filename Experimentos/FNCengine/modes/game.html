<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef's Kitchen Frenzy</title>
    <link href="css/game.css" rel="stylesheet" type="text/css">
    <style>
        /* ═══════════════════════════════════════════════════════
           CHEF'S KITCHEN FRENZY - HUD V6.0 COMPLETE REDESIGN
           Ultra Clean & Modern Gaming Interface
           ═══════════════════════════════════════════════════════ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Colores principales */
            --orange: #ff6b35;
            --orange-light: #ff8c5a;
            --orange-dark: #ff4520;
            --cyan: #00e5ff;
            --cyan-light: #5ff5ff;
            --cyan-dark: #00a8cc;
            
            /* Backgrounds */
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(15, 15, 25, 0.92);
            --glass-border: rgba(255, 255, 255, 0.1);
            
            /* Texto */
            --text-white: #ffffff;
            --text-gray: rgba(255, 255, 255, 0.7);
            --text-dim: rgba(255, 255, 255, 0.5);
            
            /* Sombras */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow-orange: 0 0 20px rgba(255, 107, 53, 0.4);
            --shadow-glow-cyan: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            background: var(--bg-dark);
        }

        /* ═══════════════════════════════════════════════════════
           CANVAS
           ═══════════════════════════════════════════════════════ */
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* ═══════════════════════════════════════════════════════
           LOADING SCREEN
           ═══════════════════════════════════════════════════════ */
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
        }

        #loadingScreen h1 {
            font-size: 48px;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--orange), var(--orange-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .spinner {
            width: 120px;
            height: 120px;
            position: relative;
            margin: 30px;
        }

        .spinner::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 8px solid rgba(255, 107, 53, 0.2);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════════════════════
           HUD COMPONENTS - SHARED STYLES
           ═══════════════════════════════════════════════════════ */
        
        .hud-panel {
            position: fixed;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(20px) saturate(180%);
            box-shadow: var(--shadow-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hud-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 2px;
            border-radius: 16px 16px 0 0;
        }

        /* ═══════════════════════════════════════════════════════
           STATS PANEL (TOP LEFT)
           ═══════════════════════════════════════════════════════ */
        
        #stats-panel {
            top: 20px;
            left: 20px;
            padding: 20px 26px;
            min-width: 280px;
            z-index: 100;
        }

        #stats-panel::before {
            background: linear-gradient(90deg, transparent, var(--orange), transparent);
        }

        .stats-primary {
            display: flex;
            gap: 22px;
            margin-bottom: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            font-weight: 600;
            color: var(--text-white);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .stat-icon {
            font-size: 22px;
        }

        .stat-value {
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .stats-secondary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-small {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ═══════════════════════════════════════════════════════
           RESOURCES PANEL (TOP RIGHT)
           ═══════════════════════════════════════════════════════ */
        
        #resources-panel {
            top: 20px;
            right: 20px;
            padding: 20px 26px;
            min-width: 240px;
            z-index: 100;
        }

        #resources-panel::before {
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-white);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .resource-icon {
            font-size: 20px;
        }

        .resource-value {
            font-weight: 700;
        }

        .resource-diamond {
            color: var(--cyan);
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }

        .resources-extras {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .resource-extra {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .active-effects {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            font-weight: 600;
            color: var(--cyan-light);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            min-height: 20px;
        }

        /* ═══════════════════════════════════════════════════════
           CONTROLS BAR (BOTTOM CENTER)
           ═══════════════════════════════════════════════════════ */
        
        #controls-bar {
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            max-width: 90vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        #controls-bar::before {
            background: linear-gradient(90deg, transparent 10%, var(--orange) 50%, transparent 90%);
        }

        #controls-bar.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(150px);
            pointer-events: none;
        }

        .control-btn {
            position: relative;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 
                0 4px 12px rgba(255, 107, 53, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }

        .control-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), transparent);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        .control-btn:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 
                0 8px 24px rgba(255, 107, 53, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .control-btn:active {
            transform: translateY(-2px) scale(1.04);
        }

        /* ═══════════════════════════════════════════════════════
           TOGGLE BUTTONS
           ═══════════════════════════════════════════════════════ */
        
        .toggle-btn {
            position: fixed;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        #toggle-controls {
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
        }

        #toggle-controls:hover {
            transform: translateX(-50%) translateY(-5px) scale(1.12);
            box-shadow: 0 8px 28px rgba(255, 107, 53, 0.7);
        }

        #toggle-ui {
            top: 28px;
            right: 280px;
            background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
        }

        #toggle-ui:hover {
            transform: translateY(-5px) scale(1.12);
            box-shadow: 0 8px 28px rgba(0, 229, 255, 0.7);
        }

        /* ═══════════════════════════════════════════════════════
           VERSION TAG
           ═══════════════════════════════════════════════════════ */
        
        #version-tag {
            position: fixed;
            bottom: 12px;
            left: 12px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.9), rgba(255, 69, 32, 0.9));
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════════════════
           UTILITY CLASSES
           ═══════════════════════════════════════════════════════ */
        
        .hidden {
            display: none !important;
        }

        /* ═══════════════════════════════════════════════════════
           RESPONSIVE DESIGN
           ═══════════════════════════════════════════════════════ */
        
        @media (max-width: 768px) {
            #stats-panel, #resources-panel {
                padding: 16px 20px;
                min-width: 220px;
            }

            .stat-item {
                font-size: 17px;
            }

            .control-btn {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            #toggle-controls, #toggle-ui {
                width: 46px;
                height: 46px;
                font-size: 18px;
            }

            #toggle-ui {
                right: 16px;
            }
        }

        @media (max-width: 480px) {
            #stats-panel, #resources-panel {
                padding: 14px 18px;
                min-width: 200px;
            }

            .stats-primary {
                gap: 16px;
            }

            .control-btn {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }

            #controls-bar {
                padding: 12px 16px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════
         LOADING SCREEN
         ═══════════════════════════════════════════════════════ -->
    
    <div id="loadingScreen">
        <h1>Chef's Kitchen Frenzy</h1>
        <div class="spinner">
            <div class="spinner-text">100%</div>
        </div>
        <p style="font-size: 18px; color: rgba(255, 255, 255, 0.7);">Preparando la cocina...</p>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         GAME CANVAS
         ═══════════════════════════════════════════════════════ -->
    
    <canvas id="gameCanvas"></canvas>

    <!-- ═══════════════════════════════════════════════════════
         HUD - STATS PANEL (TOP LEFT)
         ═══════════════════════════════════════════════════════ -->
    
    <div id="stats-panel" class="hud-panel">
        <div class="stats-primary">
            <div class="stat-item">
                <span class="stat-icon">🍳</span>
                <span class="stat-value" id="bounces">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🔥</span>
                <span class="stat-value" id="combo">1x</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">👨‍🍳</span>
                <span class="stat-value">Lv.<span id="level">1</span></span>
            </div>
        </div>
        <div class="stats-secondary">
            <div class="stat-small">
                <span>⭐</span>
                <span id="prestige">0</span>
            </div>
            <div class="stat-small">
                <span>🥘</span>
                <span id="orbCount">0</span>
            </div>
            <div class="stat-small">
                <span>⏰</span>
                <span id="afkTimer">0s</span>
            </div>
            <div class="stat-small">
                <span>⚡</span>
                <span id="streakDisplay">0x</span>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         HUD - RESOURCES PANEL (TOP RIGHT)
         ═══════════════════════════════════════════════════════ -->
    
    <div id="resources-panel" class="hud-panel">
        <div class="resource-item">
            <span class="resource-icon">🥕</span>
            <span class="resource-value" id="coins">0</span>
        </div>
        <div class="resource-item resource-diamond">
            <span class="resource-icon">🧂</span>
            <span class="resource-value" id="diamonds">0</span>
        </div>
        <div class="resources-extras">
            <div class="resource-extra">
                <span>👨‍🍳</span>
                <span id="experience">0</span>
            </div>
            <div class="resource-extra">
                <span>🔥</span>
                <span id="ascensionPoints">0</span>
            </div>
            <div class="resource-extra">
                <span>🏆</span>
                <span id="achievementCount">0</span>
            </div>
            <div class="resource-extra">
                <span>📜</span>
                <span id="cardCount">0</span>
            </div>
            <div class="resource-extra">
                <span>🎪</span>
                <span id="eventStatus">Ninguno</span>
            </div>
            <div class="resource-extra">
                <span>🏬</span>
                <span id="reputation">0</span>
            </div>
            <div class="resource-extra">
                <span>👥</span>
                <span id="customerCount">0</span>
            </div>
        </div>
        <div class="active-effects" id="activeOrbEffectsDisplay"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         HUD - CONTROLS BAR (BOTTOM CENTER)
         ═══════════════════════════════════════════════════════ -->
    
    <div id="controls-bar" class="hud-panel">
        <button id="shopBtn" class="control-btn" title="Tienda">🛒</button>
        <button id="achievementsBtn" class="control-btn" title="Logros">🏆</button>
        <button id="dailyChallengesBtn" class="control-btn" title="Desafíos">🎯</button>
        <button id="missionsBtn" class="control-btn" title="Misiones">📋</button>
        <button id="statsBtn" class="control-btn" title="Estadísticas">📈</button>
        <button id="configBtn" class="control-btn" title="Configuración">⚙️</button>
        <button id="pauseBtn" class="control-btn" title="Pausa">⏸️</button>
        <button id="importExportBtn" class="control-btn" title="Guardar/Cargar">📁</button>
        <button id="codesBtn" class="control-btn" title="Códigos">🎁</button>
        <button id="feedbackBtn" class="control-btn" title="Feedback">📝</button>
        <button id="musicBtn" class="control-btn" title="Música">🎵</button>
        <button id="prestigeBtn" class="control-btn" title="Prestigio">⭐</button>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         HUD - TOGGLE BUTTONS
         ═══════════════════════════════════════════════════════ -->
    
    <button id="toggle-controls" class="toggle-btn" title="Mostrar/Ocultar Controles">▲</button>
    <button id="toggle-ui" class="toggle-btn" title="Mostrar/Ocultar HUD">◀</button>

    <!-- ═══════════════════════════════════════════════════════
         VERSION TAG
         ═══════════════════════════════════════════════════════ -->
    
    <div id="version-tag">v2.0 🆕 DLC</div>

    <!-- ═══════════════════════════════════════════════════════
         GAME PANELS (Hidden by default)
         These remain with their original IDs for game.js compatibility
         ═══════════════════════════════════════════════════════ -->
    
    <!-- UI Container (for backward compatibility) -->
    <div id="ui-container" style="display: none;"></div>
    <div id="ui" style="display: none;"></div>
    <div id="controls" style="display: none;"></div>
    <div id="currency-display" style="display: none;"></div>
    <div id="toggleControls" style="display: none;"></div>
    <div id="toggleUI" style="display: none;"></div>
    <div id="versionIndicator" style="display: none;"></div>

    <!-- Original game panels will load from game.css -->
    <div id="config"></div>
    <div id="shop"></div>
    <div id="stats"></div>
    <div id="missions"></div>
    <div id="achievements"></div>
    <div id="dailyChallenges"></div>
    <div id="codes"></div>
    <div id="feedback"></div>
    <div id="importExport"></div>
    <div id="musicPanel"></div>

    <!-- ═══════════════════════════════════════════════════════
         SCRIPTS
         ═══════════════════════════════════════════════════════ -->
    
    <script src="js/game.js"></script>
    <script src="js/dlc.js"></script>
</body>
</html>
