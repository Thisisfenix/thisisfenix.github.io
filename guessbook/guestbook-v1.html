<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Guestbook v1.0 - FenixLaboratory</title>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSS del tema principal -->
  <link rel="stylesheet" href="../Assets/css/styles.css">
  <link rel="stylesheet" href="css/gallery-v2.css">
  
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }

    /* Canvas Container */
    .canvas-section {
      background: var(--bg-light);
      border-radius: 16px;
      padding: 2rem;
      border: 2px solid var(--primary);
      margin-bottom: 2rem;
    }

    #drawCanvas {
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: white;
      cursor: crosshair;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }

    /* Herramientas de dibujo */
    .tools-section {
      background: var(--bg-light);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(var(--primary-rgb), 0.3);
    }

    .tool-group {
      margin-bottom: 1.5rem;
    }

    .tool-group:last-child {
      margin-bottom: 0;
    }

    .tool-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.1);
      border-color: var(--primary);
    }

    .color-btn.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.3);
    }

    /* Botones de herramientas */
    .btn-tool {
      background: var(--bg-dark);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-tool:hover {
      background: var(--primary);
      color: var(--bg-dark);
    }

    .btn-tool.active {
      background: var(--primary);
      color: var(--bg-dark);
    }

    /* Galería */
    .gallery-section {
      margin-top: 3rem;
    }

    .drawing-card {
      background: var(--bg-light);
      border: 1px solid rgba(var(--primary-rgb), 0.3);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      height: 100%;
    }

    .drawing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.3);
      border-color: var(--primary);
    }

    .drawing-img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: white;
      padding: 0.5rem;
    }

    .drawing-info {
      padding: 1rem;
    }

    .drawing-author {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .drawing-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    /* Form inputs */
    .form-control,
    .form-select {
      background: var(--bg-dark);
      border: 1px solid rgba(var(--primary-rgb), 0.3);
      color: var(--text);
    }

    .form-control:focus,
    .form-select:focus {
      background: var(--bg-dark);
      border-color: var(--primary);
      color: var(--text);
      box-shadow: 0 0 0 0.2rem rgba(var(--primary-rgb), 0.25);
    }

    .form-range {
      accent-color: var(--primary);
    }

    /* Animaciones */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }

    .comment-item {
      transition: background-color 0.2s ease;
    }

    .comment-item:hover {
      background: rgba(255,255,255,0.08) !important;
    }

    .comments-container {
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }

    .comments-container::-webkit-scrollbar {
      width: 6px;
    }

    .comments-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .comments-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #drawCanvas {
        max-width: 100%;
        height: auto;
      }

      .color-palette {
        grid-template-columns: repeat(6, 1fr);
      }

      .btn-tool {
        font-size: 0.875rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="text-center mb-4">
      <h1 style="color: var(--primary);">
        <i data-lucide="palette" style="width: 2rem; height: 2rem; vertical-align: middle;"></i>
        Guestbook v1.0
      </h1>
      <p style="color: var(--text-secondary);">Dibuja, comparte y deja tu huella artística</p>
      <a href="../index.html" class="btn btn-outline-secondary btn-sm">
        <i data-lucide="home" style="width: 1rem; height: 1rem;"></i>
        Volver al Lab
      </a>
    </div>

    <div class="row">
      <!-- Panel de herramientas -->
      <div class="col-lg-3 order-lg-1 mb-3">
        <div class="tools-section">
          <h5 style="color: var(--primary); margin-bottom: 1.5rem;">
            <i data-lucide="wrench" style="width: 1.25rem; height: 1.25rem;"></i>
            Herramientas
          </h5>

          <!-- Herramienta activa -->
          <div class="tool-group">
            <div class="tool-label">
              <i data-lucide="pencil" style="width: 1rem; height: 1rem;"></i>
              Herramienta
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn-tool active" onclick="selectTool('brush')" id="tool-brush" title="Pincel">
                <i data-lucide="brush" style="width: 1rem; height: 1rem;"></i>
              </button>
              <button class="btn-tool" onclick="selectTool('eraser')" id="tool-eraser" title="Borrador">
                <i data-lucide="eraser" style="width: 1rem; height: 1rem;"></i>
              </button>
              <button class="btn-tool" onclick="selectTool('bucket')" id="tool-bucket" title="Balde de pintura">
                <i data-lucide="paint-bucket" style="width: 1rem; height: 1rem;"></i>
              </button>
              <button class="btn-tool" onclick="selectTool('spray')" id="tool-spray" title="Spray">
                <i data-lucide="spray-can" style="width: 1rem; height: 1rem;"></i>
              </button>
            </div>
          </div>

          <!-- Color -->
          <div class="tool-group">
            <div class="tool-label">
              <i data-lucide="droplet" style="width: 1rem; height: 1rem;"></i>
              Color
            </div>
            <div class="color-palette" id="colorPalette"></div>
            <input type="color" id="customColor" class="form-control" value="#ff6b35">
          </div>

          <!-- Tamaño del pincel -->
          <div class="tool-group">
            <div class="tool-label">
              <i data-lucide="circle-dot" style="width: 1rem; height: 1rem;"></i>
              Tamaño: <span id="brushSizeValue">5</span>px
            </div>
            <input type="range" class="form-range" id="brushSize" min="1" max="50" value="5">
          </div>

          <!-- Acciones -->
          <div class="tool-group">
            <div class="tool-label">
              <i data-lucide="settings" style="width: 1rem; height: 1rem;"></i>
              Acciones
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-warning btn-sm" onclick="undoCanvas()">
                <i data-lucide="undo" style="width: 1rem; height: 1rem;"></i>
                Deshacer
              </button>
              <button class="btn btn-outline-danger btn-sm" onclick="clearCanvas()">
                <i data-lucide="trash-2" style="width: 1rem; height: 1rem;"></i>
                Limpiar
              </button>
              <button class="btn btn-outline-primary btn-sm" onclick="saveDrawing()">
                <i data-lucide="save" style="width: 1rem; height: 1rem;"></i>
                Guardar Dibujo
              </button>
              <div class="btn-group w-100" role="group">
                <button type="button" class="btn btn-outline-success btn-sm" onclick="exportDrawing(false)" title="Descargar con fondo blanco">
                  <i data-lucide="download" style="width: 0.875rem; height: 0.875rem;"></i>
                  PNG
                </button>
                <button type="button" class="btn btn-outline-info btn-sm" onclick="exportDrawing(true)" title="Descargar transparente">
                  <i data-lucide="layers" style="width: 0.875rem; height: 0.875rem;"></i>
                  PNG α
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Canvas -->
      <div class="col-lg-9 order-lg-2">
        <div class="canvas-section">
          <canvas id="drawCanvas" width="800" height="600"></canvas>
        </div>

        <!-- Form de información -->
        <div class="card" style="background: var(--bg-light); border: 1px solid rgba(var(--primary-rgb), 0.3);">
          <div class="card-body">
            <h6 style="color: var(--primary); margin-bottom: 1rem;">
              <i data-lucide="user" style="width: 1rem; height: 1rem;"></i>
              Información del dibujo
            </h6>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" style="color: var(--text);">Tu nombre</label>
                <input type="text" class="form-control" id="authorName" placeholder="Anónimo" maxlength="30">
              </div>
              <div class="col-md-4">
                <label class="form-label" style="color: var(--text);">Categoría</label>
                <select class="form-select" id="categorySelect">
                  <option value="Arte">🎨 Arte</option>
                  <option value="Meme">😂 Meme</option>
                  <option value="Fanart">❤️ Fanart</option>
                  <option value="Abstracto">🌀 Abstracto</option>
                  <option value="Pixel Art">🎮 Pixel Art</option>
                  <option value="Otro">📝 Otro</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label" style="color: var(--text);">Comentario (opcional)</label>
                <input type="text" class="form-control" id="drawingComment" placeholder="Describe tu dibujo..." maxlength="100">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Galería -->
    <div class="gallery-section">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="color: var(--primary);">
          <i data-lucide="image" style="width: 1.5rem; height: 1.5rem;"></i>
          Galería de Dibujos
        </h3>
        <button class="btn btn-outline-primary btn-sm" onclick="loadDrawings()">
          <i data-lucide="refresh-cw" style="width: 1rem; height: 1rem;"></i>
          Actualizar
        </button>
      </div>

      <div id="gallery" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      </div>
    </div>
  </div>

  <!-- Modal para ver imagen completa -->
  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content" style="background: var(--bg-light); border: 2px solid var(--primary);">
        <div class="modal-header" style="border-bottom: 1px solid var(--primary);">
          <h5 class="modal-title" style="color: var(--primary);">
            <i data-lucide="image" style="width: 1.25rem; height: 1.25rem; vertical-align: middle;"></i>
            <span id="modalDrawingTitle">Dibujo</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center" style="position: relative;">
          <img id="modalDrawingImage" src="" class="img-fluid" style="max-height: 70vh; border-radius: 8px;">
          
          <!-- GIF Background Layer -->
          <div id="modalGifBackground" style="display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none;">
            <img id="modalGifBackgroundImg" src="" style="max-height: 70vh; border-radius: 8px;">
          </div>
          
          <!-- GIF Stickers Layer -->
          <div id="modalGifStickers" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none;">
            <!-- Los stickers GIF se insertarán aquí -->
          </div>
          
          <div class="mt-3">
            <p style="color: var(--text-secondary);" id="modalDrawingInfo"></p>
            <div id="modalDrawingStats" class="d-flex justify-content-center gap-3 mt-2"></div>
          </div>
        </div>
        <div class="modal-footer" style="border-top: 1px solid var(--primary);">
          <button type="button" class="btn btn-outline-primary" onclick="window.guestbookApp.showComments()">
            <i data-lucide="message-circle" style="width: 1rem; height: 1rem;"></i>
            Ver Comentarios
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de comentarios -->
  <div class="modal fade" id="commentsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content" style="background: var(--bg-light); border: 2px solid var(--primary);">
        <div class="modal-header" style="border-bottom: 1px solid var(--primary);">
          <h5 class="modal-title" style="color: var(--primary);">
            <i data-lucide="message-circle" style="width: 1.25rem; height: 1.25rem; vertical-align: middle;"></i>
            Comentarios
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="commentsContainer" class="comments-container mb-3" style="max-height: 400px; overflow-y: auto;">
            <!-- Los comentarios se cargarán aquí -->
          </div>
          
          <div class="mt-3">
            <h6 style="color: var(--primary);">Agregar comentario</h6>
            <div class="input-group">
              <input type="text" class="form-control" id="commentInput" placeholder="Escribe tu comentario..." maxlength="200">
              <button class="btn btn-primary" onclick="window.guestbookApp.addComment()">
                <i data-lucide="send" style="width: 1rem; height: 1rem;"></i>
                Enviar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Módulos existentes de Guestbook -->
  <script type="module" src="js/mobile-optimizer.js"></script>
  <script src="js/theme-adapter.js"></script>
  <script type="module" src="js/stats.js"></script>
  <script type="module" src="js/sound-system.js"></script>
  
  <!-- Módulos core compatibles -->
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/canvas.js"></script>
  <script type="module" src="js/gallery-v2.js"></script>
  <script type="module" src="js/comments.js"></script>

  <!-- Guestbook v1.0 Main Script -->
  <script type="module" src="js/guestbook-v1.js"></script>
  
  <!-- Inicializar Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
