<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Guestbook v1.0 - FenixLaboratory</title>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  
  <!-- CSS del tema principal -->
  <link rel="stylesheet" href="../Assets/css/styles.css">
  
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }

    /* Canvas Container */
    .canvas-section {
      background: var(--bg-light);
      border-radius: 16px;
      padding: 2rem;
      border: 2px solid var(--primary);
      margin-bottom: 2rem;
    }

    #drawCanvas {
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: white;
      cursor: crosshair;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }

    /* Herramientas de dibujo */
    .tools-section {
      background: var(--bg-light);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(var(--primary-rgb), 0.3);
    }

    .tool-group {
      margin-bottom: 1.5rem;
    }

    .tool-group:last-child {
      margin-bottom: 0;
    }

    .tool-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.1);
      border-color: var(--primary);
    }

    .color-btn.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.3);
    }

    /* Botones de herramientas */
    .btn-tool {
      background: var(--bg-dark);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-tool:hover {
      background: var(--primary);
      color: var(--bg-dark);
    }

    .btn-tool.active {
      background: var(--primary);
      color: var(--bg-dark);
    }

    /* Galería */
    .gallery-section {
      margin-top: 3rem;
    }

    .drawing-card {
      background: var(--bg-light);
      border: 1px solid rgba(var(--primary-rgb), 0.3);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      height: 100%;
    }

    .drawing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.3);
      border-color: var(--primary);
    }

    .drawing-img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: white;
      padding: 0.5rem;
    }

    .drawing-info {
      padding: 1rem;
    }

    .drawing-author {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .drawing-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    /* Form inputs */
    .form-control,
    .form-select {
      background: var(--bg-dark);
      border: 1px solid rgba(var(--primary-rgb), 0.3);
      color: var(--text);
    }

    .form-control:focus,
    .form-select:focus {
      background: var(--bg-dark);
      border-color: var(--primary);
      color: var(--text);
      box-shadow: 0 0 0 0.2rem rgba(var(--primary-rgb), 0.25);
    }

    .form-range {
      accent-color: var(--primary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      #drawCanvas {
        max-width: 100%;
        height: auto;
      }

      .color-palette {
        grid-template-columns: repeat(6, 1fr);
      }

      .btn-tool {
        font-size: 0.875rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>

<body>

      <!-- Canvas -->
      <div class="col-lg-9 order-lg-2">
        <div class="canvas-section">

        </div>

        <!-- Form de información -->
        <div class="card" style="background: var(--bg-light); border: 1px solid rgba(var(--primary-rgb), 0.3);">

              </div>

              </div>

    <!-- Galería -->
    <div class="gallery-section">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="color: var(--primary);">
          <i data-lucide="image" style="width: 1.5rem; height: 1.5rem;"></i>
          Galería de Dibujos
        </h3>
        <button class="btn btn-outline-primary btn-sm" onclick="loadDrawings()">
          <i data-lucide="refresh-cw" style="width: 1rem; height: 1rem;"></i>

      </div>

      <div id="drawingsGallery" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Guestbook v1.0 - Módulos JS -->
  <script type="module">
    // Importar módulos simplificados
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, doc, updateDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "AIzaSyCZk8rs_Vq9ZGgOEiP3_P6zUvZoM1QQOAM",
      authDomain: "fenix-guestbook.firebaseapp.com",
      projectId: "fenix-guestbook",
      storageBucket: "fenix-guestbook.firebasestorage.app",
      messagingSenderId: "90606615201",
      appId: "1:90606615201:web:7126a42ca59b57bdc58ee0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ==================== UI MANAGER ====================
    class UIManager {
      showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        const colors = {
          success: '#28a745',
          error: '#dc3545',
          warning: '#ffc107',
          info: '#17a2b8'
        };
        
        notification.style.cssText = `
          position: fixed; top: 20px; right: 20px; z-index: 10000;
          padding: 15px 20px; border-radius: 8px; color: white;
          background: ${colors[type] || colors.info};
          box-shadow: 0 4px 15px rgba(0,0,0,0.3);
          animation: slideIn 0.3s ease-out;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.style.animation = 'slideOut 0.3s ease-out';
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }

      createConfetti() {
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.style.cssText = `
              position: fixed; left: ${Math.random() * window.innerWidth}px; top: -10px;
              width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 9999;
              background: ${['#ff6b35', '#00ff88', '#ff6b9d', '#00ff00'][Math.floor(Math.random() * 4)]};
            `;
            document.body.appendChild(confetti);
            
            confetti.animate([
              { transform: 'translateY(0px) rotate(0deg)', opacity: 1 },
              { transform: `translateY(${window.innerHeight + 100}px) rotate(360deg)`, opacity: 0 }
            ], { duration: 2000 }).onfinish = () => confetti.remove();
          }, i * 50);
        }
      }
    }

    // ==================== CANVAS MANAGER ====================
    class CanvasManager {
      constructor() {
        this.canvas = document.getElementById('drawCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.isDrawing = false;
        this.currentColor = '#ff6b35';
        this.currentSize = 5;
        this.currentTool = 'brush';
        this.history = [];
        this.historyStep = -1;
        this.init();
      }

      init() {
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';
        this.setupEvents();
        this.saveState();
      }

      setupEvents() {
        this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
        this.canvas.addEventListener('mousemove', (e) => this.draw(e));
        this.canvas.addEventListener('mouseup', () => this.stopDrawing());
        this.canvas.addEventListener('mouseout', () => this.stopDrawing());
        
        // Touch support
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const mouseEvent = new MouseEvent('mousedown', {
            clientX: touch.clientX,
            clientY: touch.clientY
          });
          this.canvas.dispatchEvent(mouseEvent);
        }, { passive: false });
        
        this.canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const mouseEvent = new MouseEvent('mousemove', {
            clientX: touch.clientX,
            clientY: touch.clientY
          });
          this.canvas.dispatchEvent(mouseEvent);
        }, { passive: false });
        
        this.canvas.addEventListener('touchend', (e) => {
          e.preventDefault();
          this.stopDrawing();
        }, { passive: false });
      }

      getCoordinates(e) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }

      startDrawing(e) {
        this.isDrawing = true;
        const coords = this.getCoordinates(e);
        this.ctx.beginPath();
        this.ctx.moveTo(coords.x, coords.y);
      }

      draw(e) {
        if (!this.isDrawing) return;
        
        const coords = this.getCoordinates(e);
        this.ctx.lineWidth = this.currentSize;
        
        if (this.currentTool === 'brush') {
          this.ctx.strokeStyle = this.currentColor;
          this.ctx.globalCompositeOperation = 'source-over';
        } else if (this.currentTool === 'eraser') {
          this.ctx.globalCompositeOperation = 'destination-out';
        }
        
        this.ctx.lineTo(coords.x, coords.y);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.moveTo(coords.x, coords.y);
      }

      stopDrawing() {
        if (this.isDrawing) {
          this.isDrawing = false;
          this.ctx.beginPath();
          this.ctx.globalCompositeOperation = 'source-over';
          this.saveState();
        }
      }

      setTool(tool) {
        this.currentTool = tool;
      }

      setColor(color) {
        this.currentColor = color;
      }

      setSize(size) {
        this.currentSize = size;
      }

      clear() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.globalCompositeOperation = 'source-over';
        this.saveState();
      }

      undo() {
        if (this.historyStep > 0) {
          this.historyStep--;
          this.restoreState();
        }
      }

      saveState() {
        this.historyStep++;
        if (this.historyStep < this.history.length) {
          this.history.length = this.historyStep;
        }
        this.history.push(this.canvas.toDataURL());
        if (this.history.length > 50) {
          this.history.shift();
          this.historyStep--;
        }
      }

      restoreState() {
        const state = this.history[this.historyStep];
        const img = new Image();
        img.onload = () => {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          this.ctx.globalCompositeOperation = 'source-over';
          this.ctx.drawImage(img, 0, 0);
        };
        img.src = state;
      }

      isEmpty() {
        const blank = document.createElement('canvas');
        blank.width = this.canvas.width;
        blank.height = this.canvas.height;
        return this.canvas.toDataURL() === blank.toDataURL();
      }

      getImageData() {
        return this.canvas.toDataURL('image/png');
      }
    }

    // ==================== GALLERY MANAGER ====================
    class GalleryManager {
      constructor(db) {
        this.db = db;
      }

      async loadDrawings() {
        const gallery = document.getElementById('drawingsGallery');
        
        try {
          const q = query(
            collection(this.db, 'dibujos'),
            orderBy('timestamp', 'desc'),
            limit(24)
          );
          
          const snapshot = await getDocs(q);
          
          if (snapshot.empty) {
            gallery.innerHTML = `
              <div class="col-12">
                <div class="text-center text-muted py-5">
                  <i data-lucide="inbox" style="width: 3rem; height: 3rem;"></i>
                  <p class="mt-3">Todavía no hay dibujos. ¡Sé el primero!</p>
                </div>
              </div>
            `;
            lucide.createIcons();
            return;
          }

          gallery.innerHTML = '';
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const col = document.createElement('div');
            col.className = 'col';
            col.innerHTML = `
              <div class="drawing-card">
                <img src="${data.imagenData}" class="drawing-img" alt="Dibujo de ${data.autor}" loading="lazy">
                <div class="drawing-info">
                  <div class="drawing-author">
                    <i data-lucide="user" style="width: 1rem; height: 1rem;"></i>
                    <strong>${data.autor}</strong>
                  </div>
                  ${data.titulo ? `<p style="color: var(--text-secondary); font-size: 0.875rem; margin: 0.5rem 0 0 0;">${data.titulo.replace('Dibujo de ' + data.autor, '').trim()}</p>` : ''}
                  <div class="drawing-actions">
                    <button class="btn btn-sm btn-outline-primary" onclick="window.guestbookApp.likeDrawing('${docSnap.id}', this)">
                      <i data-lucide="heart" style="width: 0.875rem; height: 0.875rem;"></i>
                      <span class="like-count">${data.likes || 0}</span>
                    </button>
                    <span style="color: var(--text-secondary); font-size: 0.75rem; align-self: center;">
                      ${this.formatDate(data.timestamp)}
                    </span>
                  </div>
                </div>
              </div>
            `;
            gallery.appendChild(col);
          });

          lucide.createIcons();
        } catch (error) {
          console.error('Error cargando dibujos:', error);
          gallery.innerHTML = `
            <div class="col-12">
              <div class="alert alert-danger">Error al cargar dibujos</div>
            </div>
          `;
        }
      }

      formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'hace un momento';
        if (diff < 3600000) return `hace ${Math.floor(diff/60000)}m`;
        if (diff < 86400000) return `hace ${Math.floor(diff/3600000)}h`;
        if (diff < 604800000) return `hace ${Math.floor(diff/86400000)}d`;
        return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
      }
    }

    // ==================== GUESTBOOK APP ====================
    class GuestbookApp {
      constructor() {
        this.ui = new UIManager();
        this.canvas = new CanvasManager();
        this.gallery = new GalleryManager(db);
        this.db = db;
        this.init();
      }

      init() {
        this.setupControls();
        this.initColorPalette();
        this.gallery.loadDrawings();
        console.log('✅ Guestbook v1.0 inicializado');
      }

      setupControls() {
        // Brush size
        document.getElementById('brushSize').addEventListener('input', (e) => {
          this.canvas.setSize(parseInt(e.target.value));
          document.getElementById('brushSizeValue').textContent = e.target.value;
        });

        // Custom color
        document.getElementById('customColor').addEventListener('change', (e) => {
          this.selectColor(e.target.value, null);
        });
      }

      initColorPalette() {
        const colorPalette = [
          '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF',
          '#FF6B35', '#F7931E', '#8B5CF6', '#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#6366F1'
        ];

        const paletteEl = document.getElementById('colorPalette');
        colorPalette.forEach((color, index) => {
          const btn = document.createElement('button');
          btn.className = 'color-btn' + (index === 8 ? ' active' : '');
          btn.style.background = color;
          btn.onclick = () => this.selectColor(color, btn);
          paletteEl.appendChild(btn);
        });

        this.canvas.setColor(colorPalette[8]);
        document.getElementById('customColor').value = colorPalette[8];
      }

      selectColor(color, btn) {
        this.canvas.setColor(color);
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        document.getElementById('customColor').value = color;
      }

      selectTool(tool) {
        this.canvas.setTool(tool);
        document.querySelectorAll('.btn-tool').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tool-' + tool).classList.add('active');
      }

      clearCanvas() {
        if (confirm('¿Estás seguro de que quieres borrar todo?')) {
          this.canvas.clear();
          this.ui.showNotification('🗑️ Canvas limpiado', 'info');
        }
      }

      undoCanvas() {
        this.canvas.undo();
        this.ui.showNotification('↩️ Deshacer', 'info');
      }

      async saveDrawing() {
        if (this.canvas.isEmpty()) {
          this.ui.showNotification('¡Dibuja algo primero!', 'error');
          return;
        }

        const authorName = document.getElementById('authorName').value.trim() || 'Anónimo';
        const comment = document.getElementById('drawingComment').value.trim();
        const imageData = this.canvas.getImageData();

        try {
          const drawingData = {
            titulo: comment || `Dibujo de ${authorName}`,
            imagenData: imageData,
            timestamp: Date.now(),
            autor: authorName,
            categoria: 'Arte',
            domain: 'thisisfenix.github.io',
            likes: 0,
            comments: []
          };

          await addDoc(collection(this.db, 'dibujos'), drawingData);
          
          this.ui.showNotification('✅ ¡Dibujo guardado!', 'success');
          this.ui.createConfetti();
          this.canvas.clear();
          document.getElementById('authorName').value = '';
          document.getElementById('drawingComment').value = '';
          
          setTimeout(() => {
            this.gallery.loadDrawings();
            document.getElementById('drawingsGallery').scrollIntoView({ behavior: 'smooth' });
          }, 1000);
        } catch (error) {
          console.error('Error guardando dibujo:', error);
          this.ui.showNotification('❌ Error al guardar', 'error');
        }
      }

      async likeDrawing(drawingId, button) {
        try {
          const docRef = doc(this.db, 'dibujos', drawingId);
          const docSnap = await getDoc(docRef);
          
          if (docSnap.exists()) {
            const currentLikes = docSnap.data().likes || 0;
            await updateDoc(docRef, {
              likes: currentLikes + 1
            });
            
            const likeCount = button.querySelector('.like-count');
            if (likeCount) {
              likeCount.textContent = currentLikes + 1;
            }
            
            button.disabled = true;
            button.classList.add('text-danger');
            this.ui.showNotification('❤️ ¡Like agregado!', 'success');
          }
        } catch (error) {
          console.error('Error agregando like:', error);
          this.ui.showNotification('❌ Error al dar like', 'error');
        }
      }

      loadDrawings() {
        this.gallery.loadDrawings();
      }
    }

    // ==================== INICIALIZAR ====================
    document.addEventListener('DOMContentLoaded', () => {
      window.guestbookApp = new GuestbookApp();
      
      // Exponer funciones globales
      window.selectTool = (tool) => window.guestbookApp.selectTool(tool);
      window.clearCanvas = () => window.guestbookApp.clearCanvas();
      window.undoCanvas = () => window.guestbookApp.undoCanvas();
      window.saveDrawing = () => window.guestbookApp.saveDrawing();
      window.loadDrawings = () => window.guestbookApp.loadDrawings();
      
      // Inicializar Lucide icons
      lucide.createIcons();
    });
  </script>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }
  </style>
</body>
</html>
